[package]
name = "clashpass"
version = "0.1.0"
edition = "2021"
authors = ["Tharuk Renuja <contact.tharukrenuja@gmail.com>"]
description = "ClashPass — Password Conflict Resolver: compare password manager exports side-by-side and resolve conflicts"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.35"
native-dialog = "0.9"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
png = "0.17"
egui-phosphor = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
overflow-checks = false
incremental = false
