[package]
name = "clashpass"
version = "0.1.0"
edition = "2021"
authors = ["Tharuk Renuja <contact.tharukrenuja@gmail.com>"]
description = "ClashPass — Password Conflict Resolver: compare password manager exports side-by-side and resolve conflicts"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.35"
native-dialog = "0.9"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
png = "0.17"
egui-phosphor = "0.13"
dirs = "6"

[package.metadata.deb]
maintainer = "Tharuk Renuja <contact.tharukrenuja@gmail.com>"
copyright = "2026, Tharuk Renuja"
extended-description = "ClashPass — Password Conflict Resolver: compare password manager exports side-by-side and resolve conflicts"
section = "utils"
priority = "optional"
assets = [
    ["target/release/clashpass", "usr/bin/clashpass", "755"],
    ["clashpass.desktop", "usr/share/applications/clashpass.desktop", "644"],
    ["icons/clashpass_256.png", "usr/share/icons/hicolor/256x256/apps/clashpass.png", "644"],
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
overflow-checks = false
incremental = false
