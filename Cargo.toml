[package]
name = "clashpass"
version = "0.1.0"
edition = "2021"
authors = ["Tharuk Renuja <contact.tharukrenuja@gmail.com>"]
description = "ClashPass — Password Conflict Resolver: compare password manager exports side-by-side and resolve conflicts"

[dependencies]
eframe = "0.30"
egui = "0.30"
egui_extras = { version = "0.30", features = ["default"] }
rfd = "0.15"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
image = "0.25"
