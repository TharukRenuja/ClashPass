<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c23152"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#533483"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="#e94560" stroke-width="4"/>

  <!-- Shield body -->
  <path d="M128 40 L196 68 L196 120 C196 168 164 200 128 216 C92 200 60 168 60 120 L60 68 Z"
        fill="url(#shield)" stroke="#fff" stroke-width="3" opacity="0.9"/>

  <!-- Left clash arrow (conflict indicator) -->
  <path d="M100 90 L140 110 L120 110 L120 150 L100 150 L100 110 L80 110 Z"
        fill="#ffd460" stroke="#fff" stroke-width="2" opacity="0.85"/>

  <!-- Right clash arrow -->
  <path d="M156 106 L116 126 L136 126 L136 166 L156 166 L156 126 L176 126 Z"
        fill="#ffd460" stroke="#fff" stroke-width="2" opacity="0.85"/>

  <!-- Checkmark inset circle -->
  <circle cx="175" cy="175" r="28" fill="url(#check)" stroke="#fff" stroke-width="2"/>

  <!-- Checkmark -->
  <path d="M160 175 L172 187 L190 165"
        fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
