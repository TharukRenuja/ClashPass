<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClashPass</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Toolbar -->
  <header class="toolbar">
    <span class="app-title"><span style="color:#e53935">Clash</span><span style="color:var(--text)">Pass</span></span>
    <div class="toolbar-sep"></div>
    <button class="btn" id="btn-import" title="Ctrl+O"><i data-lucide="folder-open"></i> Import</button>
    <button class="btn" id="btn-export" disabled title="Ctrl+S"><i data-lucide="save"></i> Export</button>
    <div class="toolbar-sep"></div>
    <label class="toggle-label">
      <input type="checkbox" id="conflicts-only">
      <span>Conflicts only</span>
    </label>
    <input type="text" id="search" class="search-input" placeholder="Filter entries..." style="display:none">
    <div class="toolbar-right">
      <span class="file-badge" id="file-badge" style="display:none"></span>
    </div>
  </header>

  <!-- File Chips -->
  <div class="file-chips" id="file-chips" style="display:none">
    <span class="chip-label">Sources:</span>
    <div class="chip-list" id="chip-list"></div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" id="empty-state">
    <div class="drop-zone" id="drop-zone">
      <img src="icon.png" alt="ClashPass" class="logo">
      <h1><span style="color:#e53935">Clash</span><span style="color:var(--text)">Pass</span></h1>
      <p class="subtitle">Password Conflict Resolver</p>
      <button class="btn btn-primary" id="btn-import-empty"><i data-lucide="folder-open"></i> Import CSV</button>
      <p class="drop-hint">or drag & drop files here</p>
      <p class="supported">Bitwarden · LastPass · 1Password · Proton Pass · Chrome · Firefox</p>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="main-layout" id="main-layout" style="display:none">
    <aside class="sidebar" id="sidebar">
      <h3 class="sidebar-title">Entries</h3>
      <div class="entry-list" id="entry-list"></div>
    </aside>
    <div class="resize-handle" id="resize-handle"></div>
    <div class="compare-panel" id="compare-panel">
      <div class="compare-header" id="compare-header"></div>
      <div class="compare-body" id="compare-body"></div>
      <div class="resolved-footer" id="resolved-footer" style="display:none"></div>
    </div>
    <div class="bottom-bar"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
