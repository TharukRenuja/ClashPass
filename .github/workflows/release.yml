name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_NAME: clashpass

jobs:
  build-linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

      - name: Rename artifacts
        run: |
          cd src-tauri/target/release/bundle
          mv deb/ClashPass_*.deb "deb/clashpass-${{ github.ref_name }}-x86-linux-installer.deb"
          mv rpm/ClashPass-*.rpm "rpm/clashpass-${{ github.ref_name }}-x86-linux-installer.rpm"

      - name: Create portable tarball
        run: |
          cd src-tauri/target/release
          mkdir -p tarball/icons
          cp clashpass tarball/
          for size in 16 32 128 256; do
            cp "../../../icons/${size}x${size}.png" tarball/icons/
          done
          cd tarball
          tar czf "../clashpass-${{ github.ref_name }}-x86-linux.tar.gz" .
          cd ..
          rm -rf tarball

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86-artifacts
          path: |
            src-tauri/target/release/bundle/deb/clashpass-*
            src-tauri/target/release/bundle/rpm/clashpass-*
            src-tauri/target/release/clashpass-*.tar.gz

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

      - name: Rename artifacts
        run: |
          cd src-tauri/target/release/bundle
          mv deb/ClashPass_*.deb "deb/clashpass-${{ github.ref_name }}-arm-linux-installer.deb"
          mv rpm/ClashPass-*.rpm "rpm/clashpass-${{ github.ref_name }}-arm-linux-installer.rpm"

      - name: Create portable tarball
        run: |
          cd src-tauri/target/release
          mkdir -p tarball/icons
          cp clashpass tarball/
          for size in 16 32 128 256; do
            cp "../../../icons/${size}x${size}.png" tarball/icons/
          done
          cd tarball
          tar czf "../clashpass-${{ github.ref_name }}-arm-linux.tar.gz" .
          cd ..
          rm -rf tarball

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm-artifacts
          path: |
            src-tauri/target/release/bundle/deb/clashpass-*
            src-tauri/target/release/bundle/rpm/clashpass-*
            src-tauri/target/release/clashpass-*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

      - name: Rename artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          Copy-Item $nsis.FullName "src-tauri/target/release/bundle/nsis/clashpass-${tag}-x86-windows-installer.exe"
          Copy-Item $msi.FullName "src-tauri/target/release/bundle/msi/clashpass-${tag}-x86-windows-installer.msi"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/clashpass-*
            src-tauri/target/release/bundle/msi/clashpass-*

  build-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build --target x86_64-apple-darwin

      - name: Rename artifacts
        run: |
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/dmg
          mv ClashPass_*.dmg "clashpass-${{ github.ref_name }}-intel-macos-installer.dmg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-artifacts
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/clashpass-*

  build-macos-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Rename artifacts
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          mv ClashPass_*.dmg "clashpass-${{ github.ref_name }}-silicon-macos-installer.dmg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-silicon-artifacts
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/clashpass-*

  release:
    needs: [build-linux-x86, build-linux-arm, build-windows, build-macos-intel, build-macos-silicon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            linux-x86-artifacts/clashpass-*
            linux-arm-artifacts/clashpass-*
            windows-artifacts/clashpass-*
            macos-intel-artifacts/clashpass-*
            macos-silicon-artifacts/clashpass-*
            LICENSE
