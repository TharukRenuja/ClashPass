name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install cargo tools
        run: |
          cargo install cargo-deb

      - name: Build
        run: cargo build --release

      - name: Strip binary
        run: |
          objcopy --remove-section=.eh_frame --remove-section=.eh_frame_hdr target/release/clashpass target/release/clashpass.stripped
          mv target/release/clashpass.stripped target/release/clashpass

      - name: Package .deb
        run: cargo deb

      - name: Package tarball
        run: |
          mkdir -p artifacts/clashpass-${GITHUB_REF_NAME#v}
          cp target/release/clashpass artifacts/clashpass-${GITHUB_REF_NAME#v}/
          cp icons/clashpass_256.png artifacts/clashpass-${GITHUB_REF_NAME#v}/clashpass.png
          cd artifacts && tar czf clashpass-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz clashpass-${GITHUB_REF_NAME#v}

      - name: Move deb
        run: cp target/debian/*.deb artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Move Artifacts
        run: |
          mkdir artifacts
          Copy-Item target/release/clashpass.exe artifacts/clashpass-windows-amd64.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create .app bundle
        run: |
          ARCH_NAME="amd64"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ARCH_NAME="arm64"
          fi

          APP_DIR="artifacts/ClashPass.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          cp target/${{ matrix.target }}/release/clashpass "$APP_DIR/MacOS/"
          cp icons/clashpass_256.png "$APP_DIR/Resources/AppIcon.png"

          cat > "$APP_DIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>ClashPass</string>
            <key>CFBundleDisplayName</key>
            <string>ClashPass</string>
            <key>CFBundleIdentifier</key>
            <string>com.tharukrenuja.clashpass</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key>
            <string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleExecutable</key>
            <string>clashpass</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^          //' "$APP_DIR/Info.plist"

          hdiutil create -volname ClashPass -srcfolder artifacts/ClashPass.app -ov -format UDZO artifacts/clashpass-macos-${ARCH_NAME}.dmg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.target }}
          path: artifacts/*

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            linux-artifacts/*
            windows-artifacts/*
            macos-artifacts-*/*
            LICENSE
