name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install deps
        run: sudo apt-get install -y libgtk-3-dev librsvg2-bin imagemagick

      - name: Build
        run: cargo build --release

      - name: Package .deb
        run: |
          mkdir -p pkg/deb/usr/bin pkg/deb/usr/share/applications
          cp target/release/clashpass pkg/deb/usr/bin/
          cp clashpass.desktop pkg/deb/usr/share/applications/
          mkdir -p pkg/deb/DEBIAN
          cat > pkg/deb/DEBIAN/control <<EOF
          Package: clashpass
          Version: ${GITHUB_REF_NAME#v}
          Section: utils
          Architecture: amd64
          Maintainer: Tharuk Renuja <contact.tharukrenuja@gmail.com>
          Description: ClashPass — Password Conflict Resolver
          Depends: libc6 (>= 2.31)
          EOF
          dpkg-deb --build pkg/deb clashpass-${GITHUB_REF_NAME#v}-amd64.deb

      - name: Package tarball
        run: |
          mkdir -p pkg/tar/clashpass-${GITHUB_REF_NAME#v}
          cp target/release/clashpass pkg/tar/clashpass-${GITHUB_REF_NAME#v}/
          cp icons/clashpass_256.png pkg/tar/clashpass-${GITHUB_REF_NAME#v}/clashpass.png
          cp -r test_data pkg/tar/clashpass-${GITHUB_REF_NAME#v}/
          cd pkg/tar && tar czf ../../clashpass-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz clashpass-${GITHUB_REF_NAME#v}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clashpass-*.deb
            clashpass-*.tar.gz
