name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_NAME: clashpass

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Build
        run: cargo build --release

      - name: Strip binary
        run: |
          objcopy --remove-section=.eh_frame --remove-section=.eh_frame_hdr target/release/${{ env.APP_NAME }} target/release/${{ env.APP_NAME }}.stripped
          mv target/release/${{ env.APP_NAME }}.stripped target/release/${{ env.APP_NAME }}

      - name: Package tarball
        run: |
          mkdir -p artifacts/${{ env.APP_NAME }}-${{ github.ref_name }}-linux-amd64
          cp target/release/${{ env.APP_NAME }} artifacts/${{ env.APP_NAME }}-${{ github.ref_name }}-linux-amd64/
          cp icons/clashpass_256.png artifacts/${{ env.APP_NAME }}-${{ github.ref_name }}-linux-amd64/clashpass.png
          cd artifacts && tar czf ${{ env.APP_NAME }}-${{ github.ref_name }}-linux-amd64.tar.gz ${{ env.APP_NAME }}-${{ github.ref_name }}-linux-amd64
          rm -rf artifacts/${{ env.APP_NAME }}-${{ github.ref_name }}-linux-amd64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Move Artifacts
        run: |
          mkdir artifacts
          Copy-Item target/release/${{ env.APP_NAME }}.exe artifacts/${{ env.APP_NAME }}-${{ github.ref_name }}-windows-amd64.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: amd64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create .app bundle
        run: |
          APP_DIR="artifacts/${{ env.APP_NAME }}-${{ github.ref_name }}-macos-${{ matrix.arch }}.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          cp target/${{ matrix.target }}/release/${{ env.APP_NAME }} "$APP_DIR/MacOS/"
          cp icons/clashpass_256.png "$APP_DIR/Resources/AppIcon.png"

          cat > "$APP_DIR/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>ClashPass</string>
            <key>CFBundleDisplayName</key>
            <string>ClashPass</string>
            <key>CFBundleIdentifier</key>
            <string>com.tharukrenuja.clashpass</string>
            <key>CFBundleVersion</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleExecutable</key>
            <string>clashpass</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$APP_DIR/Info.plist"

      - name: Create DMG
        run: |
          cd artifacts
          hdiutil create -volname ClashPass \
            -srcfolder "${{ env.APP_NAME }}-${{ github.ref_name }}-macos-${{ matrix.arch }}.app" \
            -ov -format UDZO \
            "${{ env.APP_NAME }}-${{ github.ref_name }}-macos-${{ matrix.arch }}.dmg"
          rm -rf "${{ env.APP_NAME }}-${{ github.ref_name }}-macos-${{ matrix.arch }}.app"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.target }}
          path: artifacts/*

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            linux-artifacts/*
            windows-artifacts/*
            macos-artifacts-*/*
            LICENSE
