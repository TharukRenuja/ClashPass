name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_NAME: clashpass

jobs:
  build-linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

      - name: Package artifacts
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p staging
          cd src-tauri/target/release/bundle
          cp deb/ClashPass_*.deb "$GITHUB_WORKSPACE/staging/clashpass-${TAG}-x86-linux-installer.deb"
          cp rpm/ClashPass-*.rpm "$GITHUB_WORKSPACE/staging/clashpass-${TAG}-x86-linux-installer.rpm"
          cd "$GITHUB_WORKSPACE/src-tauri/target/release"
          mkdir -p tarball/icons
          cp clashpass tarball/
          for size in 16 32 128 256; do
            cp "../../../icons/${size}x${size}.png" tarball/icons/
          done
          cd tarball
          tar czf "$GITHUB_WORKSPACE/staging/clashpass-${TAG}-x86-linux.tar.gz" .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86-artifacts
          path: staging/*

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

      - name: Package artifacts
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p staging
          cd src-tauri/target/release/bundle
          cp deb/ClashPass_*.deb "$GITHUB_WORKSPACE/staging/clashpass-${TAG}-arm-linux-installer.deb"
          cp rpm/ClashPass-*.rpm "$GITHUB_WORKSPACE/staging/clashpass-${TAG}-arm-linux-installer.rpm"
          cd "$GITHUB_WORKSPACE/src-tauri/target/release"
          mkdir -p tarball/icons
          cp clashpass tarball/
          for size in 16 32 128 256; do
            cp "../../../icons/${size}x${size}.png" tarball/icons/
          done
          cd tarball
          tar czf "$GITHUB_WORKSPACE/staging/clashpass-${TAG}-arm-linux.tar.gz" .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm-artifacts
          path: staging/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

      - name: Package artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          Copy-Item $nsis.FullName "staging/clashpass-${tag}-x86-windows-portable.exe"
          Copy-Item $msi.FullName "staging/clashpass-${tag}-x86-windows-installer.msi"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: staging/*

  build-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build --target x86_64-apple-darwin

      - name: Package artifacts
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p staging
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/dmg
          cp ClashPass_*.dmg "$GITHUB_WORKSPACE/staging/clashpass-${TAG}-intel-macos-installer.dmg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-artifacts
          path: staging/*

  build-macos-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Package artifacts
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p staging
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          cp ClashPass_*.dmg "$GITHUB_WORKSPACE/staging/clashpass-${TAG}-silicon-macos-installer.dmg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-silicon-artifacts
          path: staging/*

  release:
    needs: [build-linux-x86, build-linux-arm, build-windows, build-macos-intel, build-macos-silicon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: find . -type f -name "clashpass*" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            linux-x86-artifacts/*
            linux-arm-artifacts/*
            windows-artifacts/*
            macos-intel-artifacts/*
            macos-silicon-artifacts/*
